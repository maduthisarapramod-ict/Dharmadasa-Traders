<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b45">
<title>Dharmadasa Traders POS</title>
<style>
:root{--primary:#176b45;--primary2:#218653;--ink:#17251d;--muted:#718078;--line:#e4ebe6;--bg:#f4f7f4;--card:#fff;--danger:#c0392b;--warn:#b7791f;--shadow:0 8px 28px rgba(24,55,38,.08)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:650}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#edf3ef;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff0ee;color:#a52a20;border:1px solid #ffd4ce}.small{padding:7px 10px;font-size:12px}.muted{color:var(--muted)}.hidden{display:none!important}
#loginView{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e9f4ec,#f8faf8)}.login-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:var(--shadow)}.brand-logo{width:78px;height:78px;object-fit:contain;border-radius:16px}.login-card h1{margin:12px 0 4px;font-size:25px}.login-card p{margin:0 0 22px;color:var(--muted)}
.app{min-height:100vh}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}.brand img{width:38px;height:38px;object-fit:contain}.top-actions{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav-label{font-size:10px;color:#9aa79f;font-weight:800;letter-spacing:1px;padding:10px 12px 6px}.nav button{width:100%;text-align:left;background:transparent;color:#516158;margin:2px 0;font-weight:600}.nav button.active,.nav button:hover{background:#eaf4ed;color:var(--primary)}main{padding:24px;min-width:0;max-width:1600px;width:100%;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.page-head h1{font-size:24px;margin:0}.page-head p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 2px 8px rgba(30,60,40,.025);min-width:0}.stat-label{font-size:12px;color:var(--muted);font-weight:650}.stat-value{font-size:25px;font-weight:800;margin-top:8px}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}.section-title{font-weight:800;margin:0 0 13px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;font-weight:700;color:#53645a}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dce5de;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);min-width:0;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px #2186531a}.field textarea{min-height:75px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid #edf1ee;text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#738078;background:#f8faf8}tr:last-child td{border-bottom:0}.right{text-align:right}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#edf5ef;color:#286342;font-size:11px;font-weight:700}.pill.warn{background:#fff5df;color:#9b6812}.pill.red{background:#fff0ee;color:#a52a20}.empty{padding:30px;text-align:center;color:var(--muted)}
.pos-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:15px;align-items:start}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;max-height:calc(100vh - 255px);overflow:auto;padding:2px}.product-tile{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:5px;min-height:100px}.product-tile strong{font-size:13px}.product-tile .price{font-weight:800;color:var(--primary)}.cart-card{position:sticky;top:82px}.cart-list{max-height:38vh;overflow:auto}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #edf1ee}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:3px 8px}.totals{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.total-line{display:flex;justify-content:space-between;padding:4px 0}.grand{font-size:19px;font-weight:850}.scanner-row{display:flex;gap:8px;margin-bottom:10px}.scanner-row input{flex:1}.camera-box{background:#101a14;border-radius:12px;overflow:hidden;margin:10px 0}.camera-box video{width:100%;max-height:220px;object-fit:cover}.modal-backdrop{position:fixed;inset:0;background:#0c1b12a8;z-index:30;display:grid;place-items:center;padding:15px}.modal{background:#fff;border-radius:17px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0;font-size:19px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;padding:12px 16px;border-radius:11px;background:#183d29;color:#fff;box-shadow:var(--shadow);max-width:min(420px,90vw)}.toast.error{background:#922e26}.loading{opacity:.55;pointer-events:none}.mobile-nav{display:none}.receipt{font-family:Arial,sans-serif;color:#111;max-width:380px;margin:0 auto;padding:12px}.receipt img{max-width:100px;max-height:75px;object-fit:contain}.receipt h2,.receipt p{text-align:center;margin:4px 0}.receipt table{white-space:normal}.receipt th,.receipt td{padding:5px 3px;font-size:11px;color:#111;background:#fff}.receipt .rline{border-top:1px dashed #555;margin:10px 0}.receipt .rflex{display:flex;justify-content:space-between;margin:4px 0;font-size:12px}.receipt .rgrand{font-size:17px;font-weight:bold}.receipt-foot{text-align:center;font-size:11px;margin-top:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px 1fr}.pos-grid{grid-template-columns:1fr}.cart-card{position:static}.product-grid{max-height:420px}}
@media(max-width:680px){.topbar{padding:0 13px}.brand{font-size:15px}.layout{display:block}aside{display:none}main{padding:15px 12px 90px}.page-head{align-items:flex-start}.page-head h1{font-size:21px}.grid{gap:9px}.card{padding:13px}.stat-value{font-size:20px}.two-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);overflow:auto;padding:6px;gap:3px}.mobile-nav button{flex:1;min-width:64px;background:transparent;color:#53645a;padding:8px 4px;font-size:10px}.mobile-nav button.active{background:#eaf4ed;color:var(--primary)}.mobile-nav span{display:block;font-size:17px}.top-actions .user-label{display:none}.pos-grid{gap:10px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:360px}.cart-list{max-height:250px}.toolbar input{flex:1}.page-head .toolbar{justify-content:flex-end}}
@media print{body{background:#fff}.no-print{display:none!important}#receiptPrint{display:block!important}.receipt{max-width:100%;padding:0}.receipt table{width:100%}}
</style>

  <img id="loginLogo" class="brand-logo" alt="Business logo">
  <h1 id="loginBusiness">Dharmadasa Traders</h1><p>Sign in to your point of sale</p>
  <div class="field"><label for="loginUser">Username</label><input id="loginUser" autocomplete="username" required value="0472245569"></div>
  <div class="field" style="margin-top:12px"><label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
  <button id="loginBtn" style="width:100%;margin-top:18px">Sign in</button><p id="loginError" class="muted" style="margin:12px 0 0" role="alert"></p>
 </form>
</div>
<div id="appView" class="app hidden">

</div>

const $ = id => document.getElementById(id);
let token="",settings={},products=[],categories=[],customers=[],sales=[],expenses=[],cart=[],currentPage="dashboard",lastSale=null,cameraStream=null,barcodeDetector=null,scanLoop=false;
const navItems=[["dashboard","▦","Dashboard"],["pos","▣","POS / Checkout"],["products","□","Products"],["categories","▤","Categories"],["customers","♙","Customers"],["sales","▧","Sales"],["expenses","＋","Expenses"],["reports","▥","Reports"],["settings","⚙","Settings"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function money(v){const symbol=settings.currencySymbol||settings.currency||"Rs";const n=num(v);return `${symbol} ${n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function dateText(v){if(!v)return "—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString()}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function toast(msg,error=false){const t=$("toast");t.textContent=msg;t.className="toast"+(error?" error":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add("hidden"),3500)}
function api(action,payload={}){return new Promise((resolve,reject)=>{if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.includes("PASTE_YOUR"))return reject(new Error("Add your Google Apps Script /exec URL in index.html first."));const cb="poscb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);const script=document.createElement("script");const timer=setTimeout(()=>finish(new Error("Server timeout. Check Apps Script deployment and internet connection.")),25000);function finish(err,data){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):data&&data.success?resolve(data.data):reject(new Error(data?.error||"Request failed."))}window[cb]=data=>finish(null,data);const params=new URLSearchParams({action,callback:cb,payload:JSON.stringify(payload),token});script.onerror=()=>finish(new Error("Could not connect to Google Apps Script. Check the /exec URL and deployment access."));script.src=GOOGLE_SCRIPT_URL+"?"+params.toString();document.body.appendChild(script)})}
async function loadAll(){const [s,p,c,cu,sa,ex]=await Promise.all([api("getSettings"),api("getProducts"),api("getCategories"),api("getCustomers"),api("getSales"),api("getExpenses")]);settings=s||{};products=p||[];categories=c||[];customers=cu||[];sales=sa||[];expenses=ex||[];applyBrand()}
function applyBrand(){document.title=(settings.businessName||"Store")+" POS";$("headerTitle").textContent=(settings.businessName||"Store")+" POS";$("loginBusiness").textContent=settings.businessName||"Store";const logo=settings.logo||DEFAULT_LOGO;["loginLogo","headerLogo"].forEach(id=>{const im=$(id);im.src=logo;im.onerror=()=>im.classList.add("hidden")});document.documentElement.style.setProperty("--primary",settings.primaryColor||"#176b45")}
function showApp(){ $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("userDisplay").textContent="Signed in";renderNav();go("dashboard")}
function renderNav(){const make=()=>navItems.map(([id,ic,label])=>`<button data-page="${id}" class="${id===currentPage?"active":""}"><span>${ic}</span> ${label}</button>`).join("");$("sideNav").innerHTML=`<div class="nav-label">WORKSPACE</div>${make()}`;$("mobileNav").innerHTML=make();document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(page){currentPage=page;renderNav();({dashboard:renderDashboard,pos:renderPOS,products:renderProducts,categories:renderCategories,customers:renderCustomers,sales:renderSales,expenses:renderExpenses,reports:renderReports,settings:renderSettings}[page]||renderDashboard)()}
async function refresh(){await loadAll();go(currentPage)}
function pageHead(title,sub,actions=""){return `<div class="page-head"><div><h1>${title}</h1><p>${sub||""}</p></div><div class="toolbar">${actions}</div></div>`}
function stat(label,value,note=""){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function table(headers,rows,empty="No records found"){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function modal(title,body,submitText="Save"){ $("modalHost").innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="secondary small" type="button" onclick="closeModal()">✕</button></div>${body}<div class="modal-actions"><button class="secondary" type="button" onclick="closeModal()">Cancel</button><button id="modalSave">${submitText}</button></div></section></div>`;$("modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")closeModal()};return $("modalSave")}
function closeModal(){$("modalHost").innerHTML=""}
function field(label,name,value="",type="text",required=false,extra=""){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?"required":""} ${extra}></div>`}
function selectField(label,name,options,value=""){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`}
function formData(){const o={};$("modalHost").querySelectorAll("[name]").forEach(el=>o[el.name]=el.type==="checkbox"?el.checked:el.value);return o}
async function renderDashboard(){ $("main").innerHTML=pageHead("Dashboard","Business overview")+'<div id="dashContent" class="muted">Loading dashboard…</div>';try{const d=await api("getDashboardData");$("dashContent").innerHTML=`<div class="grid">${stat("Today's sales",money(d.todaySales),"Completed sales")}${stat("Today's orders",d.todayOrders,"Invoices")}${stat("Products",d.totalProducts,"Active products")}${stat("Low stock",d.lowStockCount,"Needs replenishment")}${stat("Customers",d.totalCustomers,"Registered customers")}${stat("Today's expenses",money(d.todayExpenses),"Recorded expenses")}${stat("Estimated profit",money(d.estimatedProfit),"Revenue − cost of goods − expenses")}</div><div class="two-col"><div class="card"><h3 class="section-title">Low stock alerts</h3>${table(["Product","SKU / Barcode","Stock","Limit"],(d.lowStock||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||p.barcode||"—")}</td><td><span class="pill warn">${p.stock}</span></td><td>${p.lowStockLimit}</td></tr>`).join(""))}</div><div class="card"><h3 class="section-title">Recent sales</h3>${table(["Invoice","Date","Total"],(d.recentSales||[]).map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(dateText(s.date))}</td><td>${money(s.total)}</td></tr>`).join(""))}</div></div>`}catch(e){$("dashContent").textContent=e.message;toast(e.message,true)}}

function renderProductTiles(){const q=($("posSearch")?.value||"").toLowerCase(),cat=$("posCategory")?.value||"";const list=products.filter(p=>p.active&&(!cat||p.categoryId===cat)&&(!q||[p.name,p.sku,p.barcode,p.categoryName].some(v=>String(v||"").toLowerCase().includes(q))));$("productGrid").innerHTML=list.map(p=>`<button class="product-tile" data-add="${esc(p.id)}"><strong>${esc(p.name)}</strong><span class="muted">${esc(p.sku||p.barcode||p.categoryName||"")}</span><span class="price">${money(p.price)}</span><span class="muted">Stock: ${p.stock}</span></button>`).join("")||'<div class="empty">No matching products</div>';document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addCart(products.find(p=>p.id===b.dataset.add)))}

function manualItem(){const save=modal("Add manual item",`<div class="form-grid">${field("Item name","name","","text",true)}${field("Unit price","price","","number",true,'min="0" step=".01"')}${field("Quantity","quantity","1","number",true,'min="1" step="1"')}${field("Unit cost (optional)","cost","0","number",false,'min="0" step=".01"')}</div>`);save.onclick=()=>{const d=formData();if(!d.name.trim()||num(d.price)<0||num(d.quantity)<1){toast("Enter a name, valid price and quantity.",true);return}cart.push({productId:"",name:d.name.trim(),sku:"MANUAL",price:num(d.price),cost:num(d.cost),quantity:Math.floor(num(d.quantity)),manual:true});closeModal();renderCart()}}
async function startCamera(){if(!("BarcodeDetector"in window)){toast("This browser does not support built-in barcode scanning. Use a USB/Bluetooth scanner or enter the barcode in search.",true);return}try{barcodeDetector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("cameraBox").classList.remove("hidden");$("cameraVideo").srcObject=cameraStream;await $("cameraVideo").play();scanLoop=true;scanFrame()}catch(e){toast("Camera unavailable. Allow camera access and use the HTTPS Netlify site.",true)}}

function printReceipt(s){const cfg=settings,show=(key,val)=>cfg[key]?`<p>${esc(val)}</p>`:"";const items=s.items||[];$("receiptPrint").innerHTML=`<div class="receipt">${cfg.receiptShowLogo&&cfg.logo?`<p><img src="${esc(cfg.logo)}" alt="Logo"></p>`:""}<h2>${esc(cfg.businessName||"Store")}</h2><p>${esc(cfg.businessCategory||"")}</p>${show("receiptShowAddress",cfg.address+(cfg.city?", "+cfg.city:"")+(cfg.country?", "+cfg.country:""))}${show("receiptShowPhone",cfg.phone)}${show("receiptShowEmail",cfg.email)}<div class="rline"></div><div class="rflex"><span>Invoice</span><b>${esc(s.invoiceId)}</b></div><div class="rflex"><span>Date</span><span>${esc(dateText(s.date))}</span></div><div class="rflex"><span>Customer</span><span>${esc(s.customerName||"Walk-in")}</span></div><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th class="right">Amount</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.productName||i.name)}</td><td>${i.quantity}</td><td>${money(i.unitPrice)}</td><td class="right">${money(i.lineTotal)}</td></tr>`).join("")}</tbody></table><div class="rline"></div><div class="rflex"><span>Subtotal</span><b>${money(s.subtotal)}</b></div><div class="rflex"><span>Discount</span><b>− ${money(s.discount)}</b></div>${num(s.tax)?`<div class="rflex"><span>Tax</span><b>${money(s.tax)}</b></div>`:""}<div class="rflex rgrand"><span>Total</span><b>${money(s.total)}</b></div><div class="rflex"><span>Paid</span><b>${money(s.amountPaid)}</b></div><div class="rflex"><span>${num(s.balance)>=0?"Balance / Change":"Due from customer"}</span><b>${money(Math.abs(num(s.balance)))}</b></div><div class="rflex"><span>Payment</span><b>${esc(s.paymentMethod)}</b></div><div class="rline"></div><p class="receipt-foot">${esc(cfg.receiptFooter||"Thank you. Come again!")}</p></div>`;$("receiptPrint").classList.remove("hidden");window.print();$("receiptPrint").classList.add("hidden")}
function renderProducts(){const rows=products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||"—")}</td><td>${esc(p.barcode||"—")}</td><td>${esc(p.categoryName||"—")}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td>${p.active?'<span class="pill">Active</span>':'<span class="pill red">Inactive</span>'}</td><td><button class="small secondary" data-editp="${esc(p.id)}">Edit</button> <button class="small danger" data-delP="${esc(p.id)}">Delete</button></td></tr>`).join("");$("main").innerHTML=pageHead("Products","Manage products, barcodes, prices and stock",'<button id="addProduct">+ Add product</button>')+`<div class="toolbar"><input id="productSearch" placeholder="Search name, SKU or barcode"><select id="productCat"><option value="">All categories</option>${categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div><div id="productTable">${table(["Product","SKU","Barcode","Category","Price","Cost","Stock","Status","Actions"],rows)}</div>`;$("addProduct").onclick=()=>productModal();$("productSearch").oninput=filterProducts;$("productCat").onchange=filterProducts;document.querySelectorAll("[data-editp]").forEach(b=>b.onclick=()=>productModal(products.find(p=>p.id===b.dataset.editp)));document.querySelectorAll("[data-delP]").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delP))}

function expenseModal(e={}){const save=modal(e.id?"Edit expense":"Add expense",`<div class="form-grid">${field("Category","category",e.category||"General","text",true)}${field("Amount","amount",e.amount??"","number",true,'min=".01" step=".01"')}${field("Date","date",e.date||today(),"date",true)}<div class="field wide"><label>Description</label><textarea name="description">${esc(e.description||"")}</textarea></div></div>`);save.onclick=async()=>{const d=formData();d.amount=num(d.amount);if(!d.category.trim()||d.amount<=0||!d.date)return toast("Enter a category, valid amount and date.",true);try{await api(e.id?"updateExpense":"saveExpense",{...d,id:e.id||""});closeModal();await refresh();toast("Expense saved.")}catch(err){toast(err.message,true)}}}
async function deleteExpense(id){if(!confirm("Delete this expense?"))return;try{await api("deleteExpense",{id});await refresh();toast("Expense deleted.")}catch(e){toast(e.message,true)}}
function renderReports(){const month=today().slice(0,7);$("main").innerHTML=pageHead("Reports","Sales, stock, expenses and estimated profit")+`<div class="toolbar"><label>From <input type="date" id="reportFrom" value="${month}-01"></label><label>To <input type="date" id="reportTo" value="${today()}"></label><button id="runReport">Generate report</button></div><div id="reportOutput" class="muted">Choose dates and generate a report.</div>`;$("runReport").onclick=runReport;runReport()}
async function runReport(){const from=$("reportFrom").value,to=$("reportTo").value;if(!from||!to||from>to)return toast("Select a valid date range.",true);$("reportOutput").textContent="Loading report…";try{const d=await api("getReports",{from,to});$("reportOutput").innerHTML=`<div class="grid">${stat("Sales",money(d.totalSales),"Selected period")}${stat("Orders",d.orders,"Invoices")}${stat("Expenses",money(d.expenses),"Selected period")}${stat("Estimated profit",money(d.profit),"Sales − item cost − expenses")}</div><div class="two-col"><div class="card"><h3 class="section-title">Best-selling products</h3>${table(["Product","Qty sold","Sales"],(d.bestSellers||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.quantity}</td><td>${money(x.sales)}</td></tr>`).join(""))}</div><div class="card"><h3 class="section-title">Payment methods</h3>${table(["Method","Total"],Object.entries(d.paymentBreakdown||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join(""))}</div></div><div class="card" style="margin-top:15px"><h3 class="section-title">Daily sales</h3>${table(["Date","Orders","Sales"],(d.daily||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${x.orders}</td><td>${money(x.sales)}</td></tr>`).join(""))}</div><div class="card" style="margin-top:15px"><h3 class="section-title">Low stock</h3>${table(["Product","Stock","Limit"],(d.lowStock||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.stock}</td><td>${x.lowStockLimit}</td></tr>`).join(""))}</div>`}catch(e){$("reportOutput").textContent=e.message;toast(e.message,true)}}
function renderSettings(){const s=settings;$("main").innerHTML=pageHead("Settings","Business profile, currency, tax and receipt configuration")+`<form id="settingsForm" class="card"><div class="form-grid">${field("Business name","businessName",s.businessName||"","text",true)}${field("Business category","businessCategory",s.businessCategory||"")}${field("Currency code","currency",s.currency||"LKR")}${field("Currency symbol","currencySymbol",s.currencySymbol||"Rs")}${field("Address","address",s.address||"")}${field("City","city",s.city||"")}${field("Country","country",s.country||"")}${field("Phone","phone",s.phone||"")}${field("Email","email",s.email||"","email")}${field("Website","website",s.website||"","url")}${field("Logo URL","logo",s.logo||"","url")}${field("Primary color","primaryColor",s.primaryColor||"#176b45","color")}${field("Tax rate (%)","taxRate",s.taxRate??0,"number",true,'min="0" step=".01"')}<div class="field"><label><input type="checkbox" name="taxEnabled" ${s.taxEnabled?"checked":""}> Enable tax</label></div><div class="field"><label><input type="checkbox" name="receiptShowLogo" ${s.receiptShowLogo?"checked":""}> Show logo on receipt</label></div><div class="field"><label><input type="checkbox" name="receiptShowAddress" ${s.receiptShowAddress?"checked":""}> Show address</label></div><div class="field"><label><input type="checkbox" name="receiptShowPhone" ${s.receiptShowPhone?"checked":""}> Show phone</label></div><div class="field"><label><input type="checkbox" name="receiptShowEmail" ${s.receiptShowEmail?"checked":""}> Show email</label></div><div class="field wide"><label>Receipt footer</label><textarea name="receiptFooter">${esc(s.receiptFooter||"")}</textarea></div></div><button style="margin-top:16px">Save settings</button></form><div class="card" style="margin-top:15px"><h3 class="section-title">Security note</h3><p class="muted">Change the initial login password in Apps Script project settings / script properties after first setup. Do not share the spreadsheet or script editor with untrusted users. This MVP uses a simple staff login and session token; it is not a replacement for a full role-based identity system.</p></div>`;$("settingsForm").onsubmit=async e=>{e.preventDefault();const d={};new FormData(e.target).forEach((v,k)=>d[k]=v);["taxEnabled","receiptShowLogo","receiptShowAddress","receiptShowPhone","receiptShowEmail"].forEach(k=>d[k]=e.target.elements[k].checked);d.taxRate=num(d.taxRate);try{settings=await api("saveSettings",d);applyBrand();toast("Settings saved.");renderSettings()}catch(err){toast(err.message,true)}}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="Signing in…";$("loginBtn").disabled=true;try{const r=await api("login",{username:$("loginUser").value.trim(),password:$("loginPass").value});token=r.token;sessionStorage.setItem("dt_pos_token",token);await loadAll();showApp()}catch(err){$("loginError").textContent=err.message;$("loginBtn").disabled=false}};
$("logoutBtn").onclick=()=>{token="";sessionStorage.removeItem("dt_pos_token");cart=[];$("appView").classList.add("hidden");$("loginView").classList.remove("hidden");$("loginPass").value="";$("loginBtn").disabled=false};
(async()=>{token=sessionStorage.getItem("dt_pos_token")||"";if(token){try{await loadAll();showApp()}catch(e){token="";sessionStorage.removeItem("dt_pos_token")}}})();
</script>
</body>
</html>
